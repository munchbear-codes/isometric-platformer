<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map & Enemy Editor - Final</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-color: #2d2d2d;
            --text-color: #e0e0e0;
            --accent-color: #4a90e2;
            --danger-color: #e74c3c;
            --border-color: #444;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 300px;
            background-color: var(--panel-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow-y: auto;
            z-index: 10;
        }
        h2 { margin-top: 0; color: var(--accent-color); font-size: 1.3rem; }
        .label { display: block; margin: 15px 0 8px; font-weight: bold; font-size: 0.9rem; }
        
        .palette { display: grid; grid-template-columns: 1fr; gap: 6px; margin-bottom: 15px; }
        .tile-btn {
            background: #3a3a3a; border: 2px solid transparent; color: white;
            padding: 8px 12px; cursor: pointer; border-radius: 4px;
            text-align: left; font-size: 0.85rem;
            display: flex; align-items: center; gap: 10px;
        }
        .tile-btn:hover { background: #444; }
        .tile-btn.active { border-color: var(--accent-color); background: #333; }
        .swatch { width: 20px; height: 20px; border-radius: 3px; border: 1px solid #000; flex-shrink: 0; }

        .mode-toggle {
            background: #333; border: 1px solid var(--danger-color);
            color: var(--danger-color); padding: 10px;
            border-radius: 4px; cursor: pointer;
            text-align: center; font-weight: bold;
            margin-bottom: 10px;
            transition: all 0.2s;
        }
        .mode-toggle.active {
            background: var(--danger-color); color: white;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.4);
        }

        .controls { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
        button.action-btn {
            background-color: var(--accent-color); color: white;
            border: none; padding: 12px; border-radius: 4px;
            cursor: pointer; font-weight: bold;
        }
        button.action-btn:hover { background-color: #357abd; }
        button.secondary { background-color: #555; }
        button.secondary:hover { background-color: #666; }

        input[type="number"] {
            background: #333; border: 1px solid #555;
            color: white; padding: 5px; border-radius: 3px; width: 50px;
        }

        #main-area {
            flex: 1; background-color: #121212;
            display: flex; justify-content: center; align-items: center;
            overflow: auto; position: relative;
        }
        canvas {
            background-color: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: crosshair;
        }

        #output-modal {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none; justify-content: center; align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--panel-color); padding: 20px; border-radius: 8px;
            width: 70%; height: 70%; display: flex; flex-direction: column;
            border: 1px solid var(--border-color);
        }
        textarea {
            flex: 1; background: #111; color: #0f0;
            font-family: 'Courier New', monospace;
            border: 1px solid #444; padding: 15px; resize: none; margin-bottom: 15px;
        }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .close-btn { background: none; border: none; color: #aaa; font-size: 1.5rem; cursor: pointer; }
        .close-btn:hover { color: white; }
        
        .note {
            font-size: 0.75rem; color: #aaa; background: #222;
            padding: 8px; border-radius: 4px; margin-top: 10px;
            border-left: 3px solid var(--accent-color); line-height: 1.4;
        }
        .enemy-note { border-left-color: var(--danger-color); }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Map & Enemy Editor</h2>
    
    <div class="label">Dimensions</div>
    <div style="display:flex; gap:10px; align-items:center;">
        <label>W: <input type="number" id="map-w" value="28" min="5" max="100"></label>
        <label>H: <input type="number" id="map-h" value="16" min="5" max="100"></label>
        <button class="action-btn secondary" id="btn-resize" style="padding:5px 10px;">Set</button>
    </div>

    <div class="label">Mode</div>
    <div id="btn-enemy-mode" class="mode-toggle">
        🛑 TILE EDITING
    </div>
    <div class="note enemy-note" id="mode-hint">
        <strong>Tile Mode:</strong> Left Click = Paint, Right Click = Erase (Air).<br>
        <strong>Perimeter:</strong> Solid tiles (Wall, Spike, Water, etc.) allowed. Air/Moving Blocks blocked.
    </div>

    <div class="label">Tiles</div>
    <div class="palette" id="palette"></div>

    <div class="controls">
        <button class="action-btn" id="btn-export">Export Config Data</button>
        <button class="action-btn secondary" id="btn-clear">Clear Interior & Enemies</button>
    </div>
</div>

<div id="main-area">
    <canvas id="canvas"></canvas>
</div>

<div id="output-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Export Data</h3>
            <button class="close-btn" id="btn-close">&times;</button>
        </div>
        <textarea id="output-area" readonly></textarea>
        <button class="action-btn" id="btn-copy">Copy to Clipboard</button>
    </div>
</div>

<script>
    // --- CONFIG ---
    const TILES = {
        AIR: 0, WALL: 1, MOVING_BLOCK_VERTICAL: 2, MOVING_BLOCK_HORIZONTAL: 3,
        SPIKE_TRAP: 4, STICKY_BLOCK: 5, SHOOT_TRAP_VERTICAL: 6, SHOOT_TRAP_HORIZONTAL: 7,
        WATER: 8, GOAL: 9
    };

    const COLORS = {
        0: '#000000', 
        1: '#888888', 
        2: '#e74c3c', // Move Vert (Red)
        3: '#e74c3c', // Move Horiz (Red)
        4: '#9b59b6', // Spike (Purple)
        5: '#d35400', // Sticky (Brown)
        6: '#e67e22', // Shoot V (Orange)
        7: '#f39c12', // Shoot H (Yellow)
        8: '#2980b9', // Water (Blue)
        9: '#2ecc71'  // Goal (Green)
    };

    const LABELS = {
        0: 'Air', 1: 'Wall', 2: 'Move Block (V)', 3: 'Move Block (H)',
        4: 'Spike Trap', 5: 'Sticky Block', 6: 'Shoot Trap (V)', 7: 'Shoot Trap (H)',
        8: 'Water', 9: 'Goal'
    };

    // Tiles allowed on the perimeter (Solid/Containment)
    const PERMITTED_BORDER = [
        TILES.WALL, TILES.SPIKE_TRAP, TILES.STICKY_BLOCK, 
        TILES.SHOOT_TRAP_VERTICAL, TILES.SHOOT_TRAP_HORIZONTAL, 
        TILES.WATER, TILES.GOAL
    ];

    let width = 28;
    let height = 16;
    const SIZE = 30;
    let currentTile = TILES.WALL;
    let isDrawing = false;
    let grid = [];
    let enemies = [];
    let enemyMode = false;
    let goalPosition = null; // Tracks the single goal {x, y}

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const palette = document.getElementById('palette');
    const outModal = document.getElementById('output-modal');
    const outArea = document.getElementById('output-area');
    const btnEnemyMode = document.getElementById('btn-enemy-mode');
    const modeHint = document.getElementById('mode-hint');

    function init() {
        Object.keys(TILES).forEach(k => {
            const v = TILES[k];
            const btn = document.createElement('div');
            btn.className = `tile-btn ${v === TILES.WALL ? 'active' : ''}`;
            btn.innerHTML = `<div class="swatch" style="background:${COLORS[v]}"></div><span>${LABELS[v]}</span>`;
            btn.onclick = () => {
                currentTile = v;
                document.querySelectorAll('.tile-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            };
            palette.appendChild(btn);
        });

        resize();
        setupEvents();
        draw();
    }

    function resize() {
        width = parseInt(document.getElementById('map-w').value) || 28;
        height = parseInt(document.getElementById('map-h').value) || 16;
        
        const newGrid = [];
        for(let y=0; y<height; y++) {
            const row = [];
            for(let x=0; x<width; x++) {
                if(y < grid.length && x < grid[0].length) row.push(grid[y][x]);
                else row.push(TILES.AIR);
            }
            newGrid.push(row);
        }
        grid = newGrid;
        enforceBorder();
        
        canvas.width = width * SIZE;
        canvas.height = height * SIZE;
        draw();
    }

    function enforceBorder() {
        for(let y=0; y<height; y++) {
            for(let x=0; x<width; x++) {
                const isBorder = (x===0 || x===width-1 || y===0 || y===height-1);
                if(isBorder) {
                    const t = grid[y][x];
                    // If not allowed on border (and not Goal which is handled separately), force to Wall
                    if (!PERMITTED_BORDER.includes(t)) {
                        grid[y][x] = TILES.WALL;
                    }
                }
            }
        }
    }

    function isBorder(x, y) {
        return x===0 || x===width-1 || y===0 || y===height-1;
    }

    function canPlaceTile(x, y, type) {
        if(!isBorder(x, y)) return true;
        // Check if type is in the allowed border list
        return PERMITTED_BORDER.includes(type);
    }

    function placeGoal(x, y) {
        // Remove existing goal
        if (goalPosition) {
            const oldX = goalPosition.x;
            const oldY = goalPosition.y;
            // Reset old spot: if border, make Wall; if interior, make Air
            if (isBorder(oldX, oldY)) {
                grid[oldY][oldX] = TILES.WALL;
            } else {
                grid[oldY][oldX] = TILES.AIR;
            }
        }
        // Place new goal
        grid[y][x] = TILES.GOAL;
        goalPosition = { x, y };
    }

    function draw() {
        ctx.fillStyle = '#111';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 1;
        for(let x=0; x<=width; x++) { ctx.beginPath(); ctx.moveTo(x*SIZE,0); ctx.lineTo(x*SIZE,canvas.height); ctx.stroke(); }
        for(let y=0; y<=height; y++) { ctx.beginPath(); ctx.moveTo(0,y*SIZE); ctx.lineTo(canvas.width,y*SIZE); ctx.stroke(); }

        for(let y=0; y<height; y++) {
            for(let x=0; x<width; x++) {
                const t = grid[y][x];
                if(t !== TILES.AIR) drawTile(x,y,t);
            }
        }

        enemies.forEach((en, index) => {
            drawEnemy(en.x, en.y, en.facing, index);
        });
    }

    function drawTile(x, y, t) {
        const px = x*SIZE, py = y*SIZE, p = 1;
        ctx.fillStyle = COLORS[t];
        ctx.fillRect(px+p, py+p, SIZE-p*2, SIZE-p*2);

        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        const cx = px + SIZE/2, cy = py + SIZE/2;

        if(t === TILES.GOAL) {
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.moveTo(cx, py+SIZE*0.3); ctx.lineTo(px+SIZE*0.8, py+SIZE*0.8); ctx.lineTo(px+SIZE*0.2, py+SIZE*0.8); ctx.fill();
        }
        else if(t === TILES.MOVING_BLOCK_HORIZONTAL) {
            ctx.fillRect(px+5, cy-2, SIZE-10, 4);
            ctx.beginPath(); ctx.moveTo(px+5, cy-5); ctx.lineTo(px+5, cy+5); ctx.lineTo(px+12, cy); ctx.fill();
            ctx.beginPath(); ctx.moveTo(px+SIZE-5, cy-5); ctx.lineTo(px+SIZE-5, cy+5); ctx.lineTo(px+SIZE-12, cy); ctx.fill();
        }
        else if(t === TILES.MOVING_BLOCK_VERTICAL) {
            ctx.fillRect(cx-2, py+5, 4, SIZE-10);
            ctx.beginPath(); ctx.moveTo(cx-5, py+5); ctx.lineTo(cx+5, py+5); ctx.lineTo(cx, py+12); ctx.fill();
            ctx.beginPath(); ctx.moveTo(cx-5, py+SIZE-5); ctx.lineTo(cx+5, py+SIZE-5); ctx.lineTo(cx, py+SIZE-12); ctx.fill();
        }
        else if(t === TILES.SHOOT_TRAP_HORIZONTAL) {
            ctx.fillRect(px+5, cy-2, SIZE-10, 4);
            ctx.beginPath(); ctx.moveTo(px+5, cy-5); ctx.lineTo(px+5, cy+5); ctx.lineTo(px+12, cy); ctx.fill();
            ctx.beginPath(); ctx.moveTo(px+SIZE-5, cy-5); ctx.lineTo(px+SIZE-5, cy+5); ctx.lineTo(px+SIZE-12, cy); ctx.fill();
        }
        else if(t === TILES.SHOOT_TRAP_VERTICAL) {
            ctx.fillRect(cx-2, py+5, 4, SIZE-10);
            ctx.beginPath(); ctx.moveTo(cx-5, py+5); ctx.lineTo(cx+5, py+5); ctx.lineTo(cx, py+12); ctx.fill();
            ctx.beginPath(); ctx.moveTo(cx-5, py+SIZE-5); ctx.lineTo(cx+5, py+SIZE-5); ctx.lineTo(cx, py+SIZE-12); ctx.fill();
        }
        else if(t === TILES.SPIKE_TRAP) {
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.moveTo(px+5, py+SIZE-5); ctx.lineTo(cx, py+5); ctx.lineTo(px+SIZE-5, py+SIZE-5); ctx.fill();
        }
        else if(t === TILES.STICKY_BLOCK) {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.arc(cx, cy, SIZE/4, 0, Math.PI*2); ctx.fill();
        }
        else if(t === TILES.WATER) {
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath(); ctx.moveTo(px+5, cy-5); ctx.quadraticCurveTo(cx, cy-10, px+SIZE-5, cy-5); ctx.stroke();
        }

        if(t === TILES.WALL) {
            ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
            ctx.strokeRect(px+p, py+p, SIZE-p*2, SIZE-p*2);
        }
    }

    function drawEnemy(x, y, facing, idx) {
        const px = x*SIZE, py = y*SIZE;
        const cx = px + SIZE/2, cy = py + SIZE/2;

        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(px + 4, py + 4, SIZE - 8, SIZE - 8);
        
        ctx.fillStyle = '#fff';
        const offset = 6;
        const dx = facing === 1 ? offset : -offset;
        
        ctx.beginPath();
        ctx.arc(cx + dx, cy, 3, 0, Math.PI*2);
        ctx.fill();

        if(idx === hoverEnemyIndex) {
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(px+2, py+2, SIZE-4, SIZE-4);
        }
    }

    let hoverEnemyIndex = -1;

    function getPos(e) {
        const r = canvas.getBoundingClientRect();
        const sx = canvas.width / r.width;
        const sy = canvas.height / r.height;
        return {
            x: Math.floor(((e.clientX - r.left) * sx) / SIZE),
            y: Math.floor(((e.clientY - r.top) * sy) / SIZE)
        };
    }

    function getEnemyAt(x, y) {
        return enemies.findIndex(e => e.x === x && e.y === y);
    }

    function handle(e) {
        const p = getPos(e);
        if(p.x<0 || p.x>=width || p.y<0 || p.y>=height) return;

        const isRight = e.button === 2 || e.buttons === 2;
        const isShift = e.shiftKey;

        if (enemyMode) {
            if (isRight || isShift) {
                const idx = getEnemyAt(p.x, p.y);
                if (idx !== -1) {
                    enemies.splice(idx, 1);
                    draw();
                }
            } else if (e.buttons === 1) {
                const idx = getEnemyAt(p.x, p.y);
                if (idx !== -1) enemies.splice(idx, 1);
                enemies.push({ x: p.x, y: p.y, facing: -1 });
                draw();
            }
        } else {
            // TILE MODE
            if (isRight) {
                // Erase logic
                if (!isBorder(p.x, p.y) || PERMITTED_BORDER.includes(TILES.AIR)) { 
                    // Actually Air is never permitted on border per your rules? 
                    // You said "Only solid non-passable tiles". Air is passable.
                    // So Right Click on border should probably do nothing or flash error.
                    if (!isBorder(p.x, p.y)) {
                        grid[p.y][p.x] = TILES.AIR;
                        draw();
                    } else {
                         // Flash error for erasing border
                        ctx.strokeStyle = '#f00'; ctx.lineWidth = 3;
                        ctx.strokeRect(p.x*SIZE, p.y*SIZE, SIZE, SIZE);
                    }
                }
            } else if (e.buttons === 1) {
                // Paint logic
                if (currentTile === TILES.GOAL) {
                    placeGoal(p.x, p.y);
                    draw();
                } else if (canPlaceTile(p.x, p.y, currentTile)) {
                    grid[p.y][p.x] = currentTile;
                    draw();
                } else {
                    // Flash error
                    ctx.strokeStyle = '#f00'; ctx.lineWidth = 3;
                    ctx.strokeRect(p.x*SIZE, p.y*SIZE, SIZE, SIZE);
                }
            }
        }
    }
    
    function handleDown(e) {
        const p = getPos(e);
        if(p.x<0 || p.x>=width || p.y<0 || p.y>=height) return;
        
        if (enemyMode) {
            const isRight = e.button === 2;
            const isShift = e.shiftKey;
            
            if (isShift && isRight) {
                const idx = getEnemyAt(p.x, p.y);
                if (idx !== -1) { enemies.splice(idx, 1); draw(); }
            } else if (isRight) {
                const idx = getEnemyAt(p.x, p.y);
                if (idx !== -1) enemies.splice(idx, 1);
                enemies.push({ x: p.x, y: p.y, facing: 1 });
                draw();
            } else if (e.button === 0) {
                const idx = getEnemyAt(p.x, p.y);
                if (idx !== -1) enemies.splice(idx, 1);
                enemies.push({ x: p.x, y: p.y, facing: -1 });
                draw();
            }
        } else {
            isDrawing = true;
            handle(e);
        }
    }

    function setupEvents() {
        canvas.onmousedown = e => {
            if(!enemyMode) isDrawing = true;
            handleDown(e);
        };
        canvas.onmousemove = e => {
            if(isDrawing && !enemyMode) handle(e);
            const p = getPos(e);
            hoverEnemyIndex = getEnemyAt(p.x, p.y);
            draw();
        };
        window.onmouseup = () => isDrawing=false;
        canvas.oncontextmenu = e => e.preventDefault();

        btnEnemyMode.onclick = () => {
            enemyMode = !enemyMode;
            if(enemyMode) {
                btnEnemyMode.classList.add('active');
                btnEnemyMode.innerHTML = "⚔️ ENEMY PLACEMENT";
                modeHint.innerHTML = "<strong>Enemy Mode:</strong><br>Left Click = Face Left (-1)<br>Right Click = Face Right (1)<br>Shift+Right Click = Remove";
            } else {
                btnEnemyMode.classList.remove('active');
                btnEnemyMode.innerHTML = "🛑 TILE EDITING";
                modeHint.innerHTML = "<strong>Tile Mode:</strong><br>Left Click = Paint, Right Click = Erase (Interior Only).<br>Border: Solid tiles only. Max 1 Goal.";
            }
        };

        document.getElementById('btn-resize').onclick = resize;
        
        document.getElementById('btn-clear').onclick = () => {
            if(!confirm("Clear interior tiles AND all enemies?")) return;
            for(let y=1; y<height-1; y++)
                for(let x=1; x<width-1; x++)
                    grid[y][x] = TILES.AIR;
            enemies = [];
            goalPosition = null; // Reset goal tracking
            enforceBorder(); // Ensure border is clean
            draw();
        };

        document.getElementById('btn-export').onclick = () => {
            let mapStr = "MAP_DATA: [\n";
            for(let y=0; y<height; y++) {
                mapStr += "    [" + grid[y].join(', ') + "],\n";
            }
            mapStr += "]";

            let actorStr = "ACTOR_DATA: [\n";
            enemies.forEach((en, i) => {
                actorStr += `    { type: 'enemy', x: ${en.x}, y: ${en.y}, facing: ${en.facing} }`;
                if(i < enemies.length - 1) actorStr += ",";
                actorStr += "\n";
            });
            actorStr += "]";

            outArea.value = mapStr + ",\n\n" + actorStr;
            outModal.style.display = 'flex';
        };

        document.getElementById('btn-close').onclick = () => outModal.style.display = 'none';
        document.getElementById('btn-copy').onclick = () => {
            outArea.select();
            document.execCommand('copy');
            alert('Copied MAP_DATA and ACTOR_DATA!');
        };
    }

    init();
</script>
</body>
</html>
